<!-- You might want to add additional HTML elements to ST. 
    It's good practice to separate it out from your code -->
<div class="example-extension-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>HTML Injector</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <!-- 添加新的设置选项 -->
            <div class="example-extension_block flex-container">
                <input id="is_injection_enabled" type="checkbox" />
                <label for="is_injection_enabled">启用 HTML 注入</label>
            </div>

            <div class="example-extension_block flex-container">
                <label for="extra_height">iframe额外高度 (px):</label>
                <input id="extra_height" type="number" style="width: 60px;" value="5" />
            </div>

            <div class="example-extension_block flex-container">
                <label for="display_mode">显示模式:</label>
                <select id="display_mode">
                    <option value="1">原代码和注入效果一起显示</option>
                    <option value="2">原代码以摘要形式显示</option>
                    <option value="3">隐藏原代码，只显示注入效果</option>
                </select>
            </div>

            <div class="example-extension_block flex-container">
                <label for="activation_mode">激活模式:</label>
                <select id="activation_mode">
                    <option value="all">所有楼层</option>
                    <option value="first">第一楼层</option>
                    <option value="last">最后一楼层</option>
                    <option value="lastN">最后几层</option>
                    <option value="custom">自定义范围</option>
                </select>
            </div>

            <div class="example-extension_block flex-container">
                <label for="custom_start_floor">自定义起始楼层:</label>
                <input id="custom_start_floor" type="number" style="width: 60px;" />
                <label for="custom_end_floor" style="margin-left: 10px;">自定义结束楼层:</label>
                <input id="custom_end_floor" type="number" style="width: 60px;" />
            </div>
        </div>
    </div>
</div>
