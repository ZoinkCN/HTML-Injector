<!-- You might want to add additional HTML elements to ST. 
    It's good practice to separate it out from your code -->
<div class="example-extension-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>HTML Injector</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <!-- 添加新的设置选项 -->
            <div class="example-extension_block flex-container">
                <input id="isInjectionEnabled" type="checkbox" />
                <label for="isInjectionEnabled">启用 HTML 注入</label>
            </div>

            <div class="example-extension_block flex-container">
                <label for="extraHeight">iframe额外高度 (px):</label>
                <input id="extraHeight" class="text_pole" type="number" value="5" />
            </div>

            <div class="example-extension_block flex-container">
                <label for="displayMode">显示模式:</label>
                <select id="displayMode">
                    <option value="1">原代码和注入效果一起显示</option>
                    <option value="2">原代码以摘要形式显示</option>
                    <option value="3">隐藏原代码，只显示注入效果</option>
                </select>
            </div>

            <div class="example-extension_block flex-container">
                <label for="activationMode">激活模式:</label>
                <select id="activationMode">
                    <option value="all">所有楼层</option>
                    <option value="first">第一楼层</option>
                    <option value="last">最后一楼层</option>
                    <option value="lastN">最后几层</option>
                    <option value="custom">自定义范围</option>
                </select>
            </div>

            <div class="example-extension_block flex-container">
                <label for="customStartFloor">自定义起始楼层:</label>
                <input id="customStartFloor" class="text_pole" type="number" />
                <label for="customSndFloor" style="margin-left: 10px;">自定义结束楼层:</label>
                <input id="customEndFloor" class="text_pole" type="number" />
            </div>
        </div>
    </div>
</div>
